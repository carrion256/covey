[package]
name = "covey"
version = "0.1.0"
edition = "2024"
autobins = false
description = "Embedded-first, evidence-bearing coordination substrate for agent cohorts: fenced claims, typed completion policies, digest-bound reviews, apply queue, event log"
license = "AGPL-3.0-or-later"
repository = "https://github.com/carrion256/covey"

[[bin]]
name = "covey"
path = "src/bin/covey.rs"

[dependencies]
better-droid = { package = "better-droid-vendored", path = "vendor/better-droid" }
blake3 = "1.8.2"
clap = { version = "4.5.50", features = ["derive"] }
derive-new = "0.7.0"
derive_more = { version = "2.0.1", features = ["display", "from"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
rusqlite_migration = "2.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_rusqlite = "0.42.0"
static_assertions = "1.1.0"
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.17"
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1.9.0"
rstest = "0.25.0"
tempfile = "3.23.0"

[workspace]
members = [".", "vendor/better-droid"]
