[package]
name = "better-droid"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "better-droid"
path = "src/bin/better_droid.rs"

[dependencies]
blake3 = "1.8.2"
clap = { version = "4.5.50", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[dev-dependencies]
rstest = "0.25.0"
tempfile = "3.23.0"
